name: Build Extension

on:
  push:
    tags:
      - 'v*'
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.2.14

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache/
            node_modules/.cache/
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: QA gate · tsc + lint + vitest
        run: |
          bun run compile
          bun run lint
          bun run test

  build:
    needs: [qa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.2.14

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache/
            node_modules/.cache/
            .wxt/
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and Zip Extension
        run: |
          bun run zip
          bun run zip:firefox

      - name: Build CRX
        env:
          CRX_KEY: ${{ secrets.CRX_KEY }}
        run: |
          if [ -n "$CRX_KEY" ]; then
            printf '%s' "$CRX_KEY" > key.pem
          else
            echo "::warning::CRX_KEY secret 未配置，使用临时 key（仅 PR 冒烟，扩展 ID 与生产不一致）"
            openssl genrsa -out key.pem 2048
          fi
          bunx crx3 dist/chrome-mv3 -p key.pem -o dist/ai-proofduck.crx
          shred -u key.pem 2>/dev/null || rm -f key.pem

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: extension-builds
          path: |
            dist/*.zip
            dist/*.crx

      - name: Build Changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@cb021f9b36a51a7c6f18e4679b6fa2cb77a1260c # v4.3.1
        with:
          configuration: '.github/changelog_config.json'
          commitMode: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.0.9
        with:
          body: ${{steps.build_changelog.outputs.changelog}}
          files: |
            dist/*.zip
            dist/*.crx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
